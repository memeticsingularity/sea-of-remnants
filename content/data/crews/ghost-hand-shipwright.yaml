lore:
  - title: 船员小传·一
    content: |
      流浪号的船匠，放飞自我的艺术家。
      可惜奥托皮亚欣赏不了他的才华。
      “便宜、便宜，还是得便宜！”海仓鼠吐沫横飞，强调着自己造船的需求，“不要整你那些艺术！”
      奥托皮亚的船坞看不上自然流畅的船身，只要横拼竖凑几捆木板造出能开的玩意儿就行。
      提姆被如此粗鄙的审美气得满地打滚。图纸又一次被扔到地上，还踏上了几个黑脚印。
      直到有懂行的设计师无意中捡起，发出难以置信的惊叹：
      “这、这是船建的艺术品啊！”
  - title: 船员小传·二
    content: |
      艺术家怎会沦落到奥托皮亚打工？全因一张破嘴得罪了太多人！
      皇家造船厂的设计师们永世难忘提姆带来的阴影。
      他每天早上都准时站在门口，正一正领结，理一理发髻，随后昂首走进工坊大肆点评。
      “这是你的设计图？对不起，我以为谁把厕纸放在了这里。”
      “这画的是船？是打算让猴子帮你叠纸船吗？”
      能不能有谁把他捆起来丢海里，等等，先熬点哑药，猛灌进他的嗓子！
      同僚们从羞愧感到厌烦，纷纷堵着耳朵许下灾祸的心愿。
      苦熬数年后，他们终于盼来了转机——提姆在大人物面前栽了跟头，被一脚踢出造船厂。
      提姆晃荡到了奥托皮亚，被船老大卡特曼连夸带骗地哄进破产船坞，换一个地方继续当首席设计师。
      破产船坞的船工们岂不是要倒大霉？
      然而，他们依旧上班摸鱼偷懒，下班翘脚睡觉。
      在船坞日复一日的嘈杂中，提姆无论如何嘴碎，都掀不起风浪。
