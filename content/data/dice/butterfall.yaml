id: dice-butterfall
slug: die-yun-shai
name: 蝶陨骰
type: 强化骰
level: 1
maxLevel: 10
shortDesc: "本次航行中，每次击败敌方单位时都会积攒[蝶陨]。使用该骰子的技能会依据[蝶陨]层数额外造成伤害。每掷出6则额外造成伤害。"
detailedDesc: "本次航行中，每击败1个敌方单位，积攒1层[蝶陨]，至多获得10层。使用技能时，造成攻击力20%的伤害，且每有1层[蝶陨]再造成攻击力3%×掷骰点数的伤害。每掷出一个6点，额外造成攻击力60%的伤害。"
relatedGlossary:
  - 蝶陨
  - 骰子总点数
  - 强化骰
image: /images/dice/butterfall.png
source: 骰子抽取 / 任务奖励

buildNotes: |
  蝶陨骰为越战越强的成长型骰子，击败敌人后叠加[蝶陨]层数，层数上限 10 层。
  适合清怪能力强、能快速叠层的队伍；在长线战斗或连续多波敌人中收益最高。
