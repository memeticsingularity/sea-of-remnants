shortDesc: "此次技能结算后，使攻击力最高的友方单位释放一次上次释放的职业攻击技能。"
detailedDesc: "此次技能结算后，使攻击力最高的友方单位释放一次上次释放的职业攻击技能。攻击技能为该次伤害的技能系数×掷骰点数×9%，但不造成架势伤害也不回复能量。每掷骰一个6，额外使该次伤害提升18%。"
levelDetails:
  - level: 1
    detailedDesc: "此次技能结算后，使攻击力最高的友方单位释放一次上次释放的职业攻击技能。攻击技能为该次伤害的技能系数×掷骰点数×8%，但不造成架势伤害也不回复能量。每掷骰一个6，额外使该次伤害提升16%。"
  - level: 2
