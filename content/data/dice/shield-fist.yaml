shortDesc: "使用技能前，获得护盾，并在使用技能后依据护盾值额外造成1次伤害。每掷出6则获得额外护盾。"
detailedDesc: "使用技能前，获得（14.4%攻击力+24）×骰子总点数的护盾，持续2回合。使用技能后额外造成1次护盾值6%的伤害。每掷出1个6点，额外获得（43.2%攻击力+72）×骰子总点数的护盾。叠加护盾值不超过赋予者攻击力的1920%。"
levelDetails:
