id: dice-thundercloud
slug: lei-yun-shai
name: 雷云骰
type: 辅助技
level: 4
maxLevel: 10
shortDesc: "使用技能后，令我方全体暴击率提升，且暴击时会对主目标额外造成1次伤害。每掷出6数量则额外增加持续时间。"
detailedDesc: "使用技能后，我方全体暴击率提升3.9%，且每1点骰子点数，令我方全体暴击率再提升1%，且行动暴击后会对目标额外造成1次等同于攻击者攻击力52%的伤害，持续2回合。每掷出一个6点，持续回合数增加1回合。"
levelDetails:
  - level: 1
    detailedDesc: "使用技能后，我方全体暴击率提升3%，且每1点骰子点数，令我方全体暴击率再提升0.8%，且行动暴击后会对目标额外造成1次等同于攻击者攻击力40%的伤害，持续2回合。每掷出一个6点，持续回合数增加1回合。"
  - level: 3
    detailedDesc: "使用技能后，我方全体暴击率提升3.6%，且每1点骰子点数，令我方全体暴击率再提升1%，且行动暴击后会对目标额外造成1次等同于攻击者攻击力48%的伤害，持续2回合。每掷出一个6点，持续回合数增加1回合。"
  - level: 4
    detailedDesc: "使用技能后，我方全体暴击率提升3.9%，且每1点骰子点数，令我方全体暴击率再提升1%，且行动暴击后会对目标额外造成1次等同于攻击者攻击力52%的伤害，持续2回合。每掷出一个6点，持续回合数增加1回合。"
