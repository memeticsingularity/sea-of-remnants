rules: |
  **黑券往日之影**
  - 基础概率 0.80%，综合概率 1.84%
  - 最多 80 次寻找必定获得 1 个黑券往日之影
  - 获得黑券往日之影时 75% 为「安眠人偶」，25% 为其他黑券往日之影
  - 若本次黑券往日之影不是「安眠人偶」，则下次黑券往日之影必定为「安眠人偶」

  **紫券往日之影**
  - 基础概率 6.00%，综合概率 13.00%
  - 最多 10 次寻找必定获得紫券及以上往日之影
  - 紫券往日之影 50% 为当期 UP「迷你号鲇鱼的消亡」/「此刻即未来」，50% 为其他紫券往日之影
  - 若本次紫券往日之影非当期 UP，则下次紫券往日之影必定为当期 UP

  **蓝券往日之影**
  - 基础概率 93.20%，综合概率 85.15%

