rules: |
  **黑券船员**
  - 基础概率 0.80%，综合概率 1.84%
  - 最多 80 次招募必定获得 1 个黑券船员
  - 首次获得的黑券船员必定是「茉莉」
  - 除首次外，获得黑券船员时 50% 为「茉莉」，50% 为本卡池其他黑券船员
  - 若本次黑券船员不是「茉莉」，则下次黑券船员必定为「茉莉」

  **紫券船员及往日之影**
  - 基础概率 6.00%，综合概率 13.00%（船员 3.00%，往日之影 3.00%）
  - 最多 10 次招募必定获得紫券及以上船员或往日之影
  - 紫券对象 50% 为当期 UP「艾丝」/「预兆之眼」，50% 为其他紫券船员/往日之影
  - 若本次紫券对象非当期 UP，则下次紫券对象必定为当期 UP

  **蓝券往日之影**
  - 基础概率 93.20%，综合概率 84.58%

