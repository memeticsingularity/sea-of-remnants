buildNotes: |
  该技能携带「额外行动×2」标签，是 II 阶职业「讨债人」的可选职业技之一。

  伤害倍率会随强化骰数量提升；目标身上有[暗影]时再增伤，且对高血量目标可追加[初始技能]。
  适合作为敏捷系单体收割手段。
