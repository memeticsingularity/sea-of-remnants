shortDesc: "对敌方单体造成2段攻击力77%的伤害，若目标拥有[暗影]，则消耗1层[暗影]使本次伤害提高10%；若目标当前体力值高于80%，则追击1次[初始技能]。"
detailedDesc: "对敌方单体造成2段攻击力19.25%×强化骰数量+77%的伤害，若目标拥有[暗影]，则消耗1层[暗影]使本次伤害提高10%；若目标当前体力值高于80%，则追击1次[初始技能]。"
