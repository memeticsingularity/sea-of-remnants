shortDesc: |
  对敌方单体造成攻击力200%/400%的伤害，并将[结构缺陷]转移至该目标。
  若场上没有[结构缺陷]，则为该目标施加[结构缺陷]。
  使[结构缺陷]的计数增加其上限的20%。
