id: skill-shipwrights-keen-eye
slug: chuan-jiang-rui-yan
name: 船匠锐眼
type: 被动技
level: 1
maxLevel: 15
shortDesc: |
  战斗开始时，对场上威胁最高的1个敌方单位施加[结构缺陷]。
  [结构缺陷]：防御力降低15%/30%，记录携带者所受伤害的10%/20%，计数上限为鬼手船匠攻击力的450%。
  计数达到上限时，对敌方全体造成等同于记录值的伤害并清空计数。
detailedDesc: |
  战斗开始时，对场上威胁最高的1个敌方单位施加[结构缺陷]。
  [结构缺陷]：防御力降低15%。记录携带者所受伤害的10%，计数上限为鬼手船匠基础攻击力的450%，上限值会随着鬼手船匠的等级提升而提升。计数达到上限时，对敌方全体造成等同于记录值的伤害并清空计数。
