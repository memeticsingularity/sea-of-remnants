id: class-exotic-fate-weaver
slug: yi-xiang-chan-ming-ren
name: 异香缠命人
type: 职业
tier: III
role: 暴击 / 爆发
combatRoles:
  - 主攻
description: "敏捷系 III 阶职业，由缠命人进阶而来，对应标签「暴击」。"
unlockCondition: 由缠命人进阶（III阶）
passives:
  - name: 复仇日
    level: 1
    effect: "暴击时，若目标为散怪且体力值低于50%，则有10%的概率令其瞬间力竭。若目标不是散怪则改为造成1.5倍暴击伤害。每导致1个敌方单位瞬间力竭，本次航行中自身暴击率永久提升0.1%，至多提升5%。"
statBoosts:
  六维属性强化: "12"

buildNotes: |
  三阶暴击职业，被动「复仇日」对低血量散怪有概率直接力竭，对非散怪则提高暴伤倍率。

  根据标签数量，被动效果还会进一步提升：
  - 暴击×4：造成瞬间力竭的概率提升 1% / 2% / 3% / 4%
  - 暴击×4：造成瞬间力竭时，若目标不是散怪，造成的1.5倍暴击伤害最终值增加 6% / 12% / 18% / 24%
  - 额外行动×0：造成瞬间力竭时，对目标发动[追猎]，伤害系数为 40% / 80% / 120%
  - 负面状态×0：造成瞬间力竭时，为目标施加[心碎]，层数为 1 / 2 / 3
  - 招牌技×0：每回合最多生效1次。造成瞬间力竭时，回复招牌技能量 5% / 10% / 15%

  当前标签进度示例：暴击 4/8、额外行动 0/8、负面状态 0/8、招牌技 0/8。
