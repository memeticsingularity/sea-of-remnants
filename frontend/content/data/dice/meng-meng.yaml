id: dice-meng-meng
slug: meng-meng-shai
name: 猛猛骰
type: 辅助技
level: 3
maxLevel: 10
shortDesc: "使用技能后，令此次攻击额外造成一定段数的伤害，且每掷出6则额外增加段数。"
detailedDesc: "每使用1个强化骰，令此次攻击额外造成1次攻击力126%的伤害，每掷出一个6点，再额外造成1次伤害。"
relatedGlossary:
  - 强化骰
  - 骰子总点数
